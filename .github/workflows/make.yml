name: Build FLEX_ZH Deb

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          submodules: recursive  # 递归拉取子模块

      - name: Check cache for Theos and SDKs
        run: |
          echo upstream_heads=`git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v4.2.1
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        uses: huami1314/theos-action@main
        with:
          theos-path: ${{ github.workspace }}/theos

      - name: Install dependencies
        run: |
          brew install make bzip2 ldid
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix)/opt/bzip2/bin" >> $GITHUB_PATH

      - name: Setup iPhoneOS14.5 SDK
        run: |
          curl -LO https://github.com/theos/sdks/releases/download/2023-08-10/iPhoneOS14.5.sdk.tbz2
          ls -lh iPhoneOS14.5.sdk.tbz2
          if [ $(stat -f %z iPhoneOS14.5.sdk.tbz2) -lt 1000000 ]; then
            echo "Error: Downloaded file is too small!"
            exit 1
          fi
          mkdir -p $THEOS/sdks
          tar -xjf iPhoneOS14.5.sdk.tbz2 -C $THEOS/sdks/

      - name: Clean build directory
        run: |
          rm -rf packages/*
          gmake clean

      - name: Build package (rootful)
        run: |
          gmake package FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)

      - name: Build package (rootless)
        run: |
          gmake package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)

      - name: Build package (roothide)
        run: |
          gmake package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)

      - name: Upload Deb packages
        uses: actions/upload-artifact@v4.6.0
        with:
          name: FLEX_ZH
          path: ${{ github.workspace }}/packages/*.deb
